name: Mirror to public org
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  mirror:
    if: github.repository != 'test-organization-for-mirror/test-project'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to BDRThermeaGroup
        env:
          KEY: ${{ secrets.PUBLIC_MIRROR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote add public git@github.com:test-organization-for-mirror/test-project.git
          git push public HEAD:refs/heads/main
          git push public --tags
